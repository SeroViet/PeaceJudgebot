[project]
name = "alpha-scout"
version = "0.1.0"
description = "Langfrist-Investment-Scout mit Telegram-Alerts (Aktien, ETFs, Krypto)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "aiosqlite>=0.20",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "python-telegram-bot>=21.0,<23",
    "yfinance>=0.2.50",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff==0.17.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alpha_scout*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["alpha_scout"]
