# Betrieb auf eigenem VPS (z. B. Hetzner/Infomaniak). HTTPS über Caddy (automatisches Zertifikat).
# 1) .env mit den Secrets anlegen (siehe .env.example), 2) DOMAIN setzen, 3) docker compose up -d
services:
  app:
    build: .
    env_file: .env
    volumes: [data:/data]
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${DOMAIN:?DOMAIN setzen} --to app:8000
    volumes: [caddy:/data]
    restart: unless-stopped
  backup:
    image: alpine:3
    volumes: [data:/data, ./backups:/backups]
    command: sh -c 'while true; do cp /data/fussball.db /backups/fussball-$$(date +%F).db 2>/dev/null; find /backups -name "*.db" -mtime +14 -delete; sleep 86400; done'
    restart: unless-stopped
volumes:
  data:
  caddy:
