# Wettbewerbe, die aus football-data.co.uk importiert werden.
# Schlüssel = Datei-Code bei football-data.co.uk (https://www.football-data.co.uk/data.php)
# api_football_id = League-ID bei API-Football (v3), für die spätere Verknüpfung.
# enabled = Standard-Auswahl für `python -m fussball import-fd` ohne --leagues.

leagues:
  E0:  {name: Premier League,      country: England,     tier: 1, api_football_id: 39,  enabled: true}
  E1:  {name: Championship,        country: England,     tier: 2, api_football_id: 40,  enabled: false}
  D1:  {name: Bundesliga,          country: Germany,     tier: 1, api_football_id: 78,  enabled: true}
  D2:  {name: 2. Bundesliga,       country: Germany,     tier: 2, api_football_id: 79,  enabled: false}
  I1:  {name: Serie A,             country: Italy,       tier: 1, api_football_id: 135, enabled: true}
  I2:  {name: Serie B,             country: Italy,       tier: 2, api_football_id: 136, enabled: false}
  SP1: {name: La Liga,             country: Spain,       tier: 1, api_football_id: 140, enabled: true}
  SP2: {name: Segunda Division,    country: Spain,       tier: 2, api_football_id: 141, enabled: false}
  F1:  {name: Ligue 1,             country: France,      tier: 1, api_football_id: 61,  enabled: true}
  F2:  {name: Ligue 2,             country: France,      tier: 2, api_football_id: 62,  enabled: false}
  N1:  {name: Eredivisie,          country: Netherlands, tier: 1, api_football_id: 88,  enabled: false}
  P1:  {name: Primeira Liga,       country: Portugal,    tier: 1, api_football_id: 94,  enabled: false}
  B1:  {name: Jupiler Pro League,  country: Belgium,     tier: 1, api_football_id: 144, enabled: false}
  T1:  {name: Süper Lig,           country: Turkey,      tier: 1, api_football_id: 203, enabled: false}
  SC0: {name: Scottish Premiership, country: Scotland,   tier: 1, api_football_id: 179, enabled: false}
  G1:  {name: Super League Greece, country: Greece,      tier: 1, api_football_id: 197, enabled: false}
