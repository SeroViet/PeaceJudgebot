<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Login – PeaceJudge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0b0f14; color: #e6edf3; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    input { background: #0b0f14; border: 1px solid #2d3a4a; border-radius: 10px; padding: 10px 12px; color: #e6edf3; width: 100%; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
  <form method="post" action="/login" class="w-full max-w-sm space-y-4 bg-[#121821] border border-[#1f2a37] rounded-2xl p-6">
    <h1 class="text-xl font-bold">⚽ PeaceJudge</h1>
    {% if not configured %}
      <p class="text-sm text-amber-400">Noch kein Passwort eingerichtet. Auf dem Server ausführen:
        <code class="block mt-2 text-xs bg-black/40 p-2 rounded">python -m fussball set-password</code></p>
    {% endif %}
    {% if error %}<p class="text-sm text-red-400">{{ error }}</p>{% endif %}
    <label class="block text-sm">Passwort
      <input type="password" name="password" autocomplete="current-password" required autofocus>
    </label>
    {% if totp %}
    <label class="block text-sm">6-stelliger Code (Authenticator-App)
      <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" required>
    </label>
    {% endif %}
    <button class="w-full bg-blue-600 rounded-xl py-2.5 font-semibold">Anmelden</button>
  </form>
</body>
</html>
