# Einsatz- und Tipp-Regeln. Alle Werte sind in der Web-App unter "Einstellungen" änderbar.
currency: CHF
bankroll: 500.0
# Nur bei diesen Buchmachern nach der besten Quote suchen (Kürzel, z. B. [WH, 1XB, TIP]).
# Leer = alle. Trage hier nur Anbieter ein, die in deinem Land zugelassen sind und bei
# denen du ein Konto hast. Welche Kürzel es gibt: siehe App → Mehr → Einstellungen.
bookmakers: []

singles:
  # Wahrscheinlichkeit = faire Pinnacle-Quote (ohne Marge). Tipp nur, wenn ein Buchmacher
  # mind. min_edge darüber liegt. Backtest 2020–2026, 10 Ligen, Edge ≥ 3 %:
  # 817 Wetten, CLV +3.6 % (in jeder Saison positiv), ROI +3.2 %.
  price: best             # best = beste Quote eines echten Buchmachers, avg = Durchschnitt
  min_edge: 0.03          # Edge = p × Quote − 1
  min_prob: 0.0
  max_odds: 4.0
  kelly_fraction: 0.25    # Viertel-Kelly
  max_stake_pct: 0.02     # max. 2 % der Bankroll pro Tipp
  daily_limit_pct: 0.06
  weekly_limit_pct: 0.15

# "Sicher-Tipps": hohe Trefferwahrscheinlichkeit, alle Märkte (Über/Unter, beide treffen, 1X, …),
# abgeleitet aus Pinnacle. Historisch (2020–2026, 170 000 Tipps im Bereich 70–90 %):
# erwartet 78.2 %, getroffen 78.5 %. Hohe Trefferquote heisst NICHT automatisch Gewinn:
# nur spielen, wenn die Quote beim Anbieter ≥ fairer Quote ist.
safe:
  min_prob: 0.70
  max_prob: 0.90
  per_match: 2

# Tageskombi: 5er/6er, alle Spiele am selben Tag, pro Spiel der sicherste Tipp aus allen Märkten.
day_combo:
  sizes: [3, 5]
  min_prob: 0.75
  max_prob: 0.88

# Risiko-Kombi: höhere Quoten (Über/Unter 2.5, beide treffen, Sieg), andere Spiele als die Tageskombi
risky_combo:
  size: 3
  min_prob: 0.60
  max_prob: 0.72

# Krass-Kombi: 5 Spiele mit 55–70 % → Quote ca. 8–12, geht etwa an 1 von 10 Tagen auf (nicht vom Scout geprüft)
krass_combo:
  size: 5
  min_prob: 0.55
  max_prob: 0.70

combos:
  min_legs: 4
  max_legs: 6
  leg_min_prob: 0.60
  leg_min_edge: 0.03
  leg_min_odds: 1.50      # z. B. Mindestquote für KombiBoost
  min_total_prob: 0.05
  kelly_fraction: 0.10    # deutlich kleiner als bei Einzeltipps
  max_stake_pct: 0.01
  # Bonus des Anbieters je Anzahl Tipps (Gewinn-Multiplikator auf den Nettogewinn).
  # Konkrete Werte beim Anbieter prüfen und hier eintragen, z. B. {4: 0.05, 5: 0.10}.
  boost: {}

# Ligen, in denen das Modell im Backtest den Markt nicht schlägt, werden automatisch
# gesperrt (siehe `python -m fussball backtest`). Hier manuell erzwingen:
force_enabled_leagues: []
force_disabled_leagues: []
