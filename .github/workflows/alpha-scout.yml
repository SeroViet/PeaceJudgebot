name: alpha-scout

on:
  push:
    paths: ["alpha-scout/**", ".github/workflows/alpha-scout.yml"]
  pull_request:
    paths: ["alpha-scout/**", ".github/workflows/alpha-scout.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alpha-scout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
